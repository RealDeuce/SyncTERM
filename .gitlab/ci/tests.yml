# Included only for full-test pipelines. GitLab deep-merges this report with
# the common artifact paths; build-only jobs do not request a missing JUnit file.
default:
  artifacts:
    reports:
      junit: build-ci/reports/junit.xml

ci-driver-tests:
  stage: check
  timeout: 2 hours
  tags: [Linux]
  script:
    - cmake -S ci/tests -B build-ci
    - cmake --build build-ci
    - ctest --test-dir build-ci --output-on-failure --no-tests=error --output-junit "$CI_PROJECT_DIR/build-ci/reports/junit.xml"
