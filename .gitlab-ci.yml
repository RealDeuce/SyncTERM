workflow:
  name: 'SyncTERM $SYNCTERM_CI_MODE'
  rules:
    # A manually selected test pipeline must also work for branches with an MR.
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages: [check, build-test]

variables:
  SYNCTERM_CI_MODE:
    value: build
    options: [build, full-test]
    description: 'Build downloadable artifacts, or run the full test matrix before collecting artifacts.'
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  CTEST_PARALLEL_LEVEL: "1"
  CI_BUILD_TYPE: RelWithDebInfo
  CI_PROFILE: native
  # This is an acknowledged coverage gap, not a successful Haiku build.
  SYNCTERM_CI_HAIKU: "0"
  # Enable only on a Linux runner provisioned with Clang.
  SYNCTERM_CI_CLANG: "0"

default:
  interruptible: true
  cache:
    key: "ccache-$CI_JOB_NAME_SLUG"
    paths: [.ci-cache/ccache/]
  artifacts:
    name: "syncterm-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 1 week
    paths:
      - build-ci/reports/
      - build-ci/artifacts/

include:
  - local: .gitlab/ci/tests.yml
    rules:
      - if: '$SYNCTERM_CI_MODE == "full-test"'
  - local: .gitlab/ci/posix.yml
    inputs: {name: linux-gcc, tag: Linux, cc: gcc, cxx: g++}
  - local: .gitlab/ci/posix.yml
    inputs: {name: linux-clang, tag: Linux, cc: clang, cxx: clang++}
  - local: .gitlab/ci/posix.yml
    inputs: {name: alpine-linux, tag: alpine-linux}
  - local: .gitlab/ci/posix.yml
    inputs: {name: linux-arm64, tag: RaspberryPi}
  - local: .gitlab/ci/posix.yml
    inputs: {name: freebsd, tag: FreeBSD}
  - local: .gitlab/ci/posix.yml
    inputs: {name: openbsd, tag: OpenBSD}
  - local: .gitlab/ci/posix.yml
    inputs: {name: netbsd, tag: NetBSD}
  - local: .gitlab/ci/posix.yml
    inputs: {name: macos-arm64, tag: macOS-aarch64}
  - local: .gitlab/ci/posix.yml
    inputs: {name: linux-minimal, tag: Linux, cc: gcc, cxx: g++, profile: minimal}
    rules:
      - if: '$SYNCTERM_CI_MODE == "full-test"'
  - local: .gitlab/ci/posix.yml
    inputs: {name: linux-sanitizers, tag: Linux, cc: gcc, cxx: g++, profile: sanitizers}
    rules:
      - if: '$SYNCTERM_CI_MODE == "full-test"'
  - local: .gitlab/ci/posix.yml
    inputs: {name: linux-mixed-linkage, tag: Linux, cc: gcc, cxx: g++, profile: mixed-linkage}
    rules:
      - if: '$SYNCTERM_CI_MODE == "full-test"'
  - local: .gitlab/ci/posix.yml
    inputs: {name: mingw32-cross, tag: FreeBSD, profile: mingw32-cross}
  - local: .gitlab/ci/posix.yml
    inputs: {name: mingw64-cross, tag: FreeBSD, profile: mingw64-cross}
  - local: .gitlab/ci/windows.yml

# Job artifacts replace (rather than merge with) default artifacts. These
# jobs intentionally have no JUnit report because target code is not run.
.cross-artifacts:
  artifacts:
    name: "syncterm-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 1 week
    paths: [build-ci/reports/, build-ci/artifacts/]

mingw32-cross:
  extends: .cross-artifacts

mingw64-cross:
  extends: .cross-artifacts

linux-clang:
  rules:
    - if: '$SYNCTERM_CI_CLANG == "1"'

macos-arm64:
  resource_group: macos-arm64-native-ui

haiku:
  stage: build-test
  timeout: 2 hours
  dependencies: []
  tags: [Haiku]
  rules:
    - if: '$SYNCTERM_CI_HAIKU == "1"'
  script:
    - sh ci/posix.sh
