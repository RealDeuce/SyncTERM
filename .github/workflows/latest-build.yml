name: Latest build

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * *'

permissions:
  contents: read

env:
  SYNCTERM_CI_MODE: build
  CI_BUILD_TYPE: Release
  CMAKE_BUILD_PARALLEL_LEVEL: '4'

jobs:
  build:
    if: >-
      github.repository == 'RealDeuce/SyncTERM' &&
      github.event_name != 'schedule' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: windows-x86_64
            runner: windows-2022
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    concurrency:
      group: latest-build-${{ matrix.platform }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux development dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libsdl2-dev libncurses-dev libx11-dev libxrender-dev libxrandr-dev \
            libxinerama-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libasound2-dev libsndfile1-dev libjpeg-dev libjxl-dev
      - name: Identify dependency cache environment
        id: dependency-cache
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const {execFileSync} = require('node:child_process');
          if (!process.env.ImageVersion) throw new Error('Missing hosted runner image version');
          const identity = [process.env.ImageOS, process.env.ImageVersion,
            process.cwd(), process.env.CI_BUILD_TYPE, process.env.CI_EXTRA_CMAKE_ARGS,
            ...['CC', 'CXX', 'CFLAGS', 'CXXFLAGS', 'CPPFLAGS', 'LDFLAGS',
              'CMAKE_GENERATOR', 'CMAKE_GENERATOR_PLATFORM', 'CMAKE_GENERATOR_TOOLSET',
              'MACOSX_DEPLOYMENT_TARGET', 'SDKROOT'].map(name => process.env[name]),
            execFileSync('cmake', ['--version']).toString()];
          const digest = crypto.createHash('sha256').update(JSON.stringify(identity)).digest('hex');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `environment=${digest}\n`);
          JS
          # The compiled-cache key hashes all these inputs. Stable mtimes keep
          # a fresh checkout from invalidating ExternalProject's cached steps.
          git ls-files -z -- CMakeLists.txt '**/CMakeLists.txt' 'cmake/**' 'ci/**' |
            TZ=UTC xargs -0 touch -t 200001010000
      - name: Cache pinned source archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-ci/dependency-downloads/
          key: dependency-sources-v1-${{ hashFiles('cmake/dependencies/lock.json') }}
          restore-keys: dependency-sources-v1-
      - name: Cache compiled pinned dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-ci/dependencies/
          key: dependencies-v1-${{ matrix.platform }}-${{ steps.dependency-cache.outputs.environment }}-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt', 'cmake/**', 'ci/**', '.github/workflows/latest-build.yml') }}
      - name: Build POSIX products
        if: runner.os != 'Windows'
        run: sh ci/posix.sh
      - name: Build Windows products
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./ci/windows.ps1 -Compiler msvc -Architecture x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        run: cmake -DCI_BUILD_DIR=build-ci -DPACKAGE_NAME=syncterm-${{ matrix.platform }} -P ci/github-package.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latest-build-${{ matrix.platform }}
          path: build-ci/packages/*.zip
          if-no-files-found: error
          retention-days: 1
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.platform }}
          path: build-ci/reports/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: latest-build-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: latest-build-*
          path: packages
          merge-multiple: true
      - name: Check release lifecycle
        run: node --test ci/tests/github-release.test.cjs
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            await require('./ci/github-release.cjs').publish({github, context, core});

  expire:
    if: github.repository == 'RealDeuce/SyncTERM' && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: latest-build-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            await require('./ci/github-release.cjs').expire({github, context, core});
